<form (ngSubmit)="onSubmit(titleInput)">
    <app-control label="Title">
        <input type="text" name="title" id="title" #titleInput>
    </app-control>
    <app-control label="Request">
        <textarea type="text" name="request" id="request" rows="3"></textarea>
    </app-control>
    <p>
        <button appButton>
            Submit
            <span ngProjectAs="icon">&#11162;</span>
        </button>
    </p>
</form>
