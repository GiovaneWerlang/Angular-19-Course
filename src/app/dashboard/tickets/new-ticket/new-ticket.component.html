<form (ngSubmit)="onSubmit()" #form>
    <app-control label="Title">
        <input type="text" name="title" id="title" #input [(ngModel)]="enteredTitle">
    </app-control>
    <app-control label="Request">
        <textarea type="text" name="request" id="request" rows="3" #input [(ngModel)]="enteredRequest"></textarea>
    </app-control>
    <p>
        <button appButton>
            Submit
            <span ngProjectAs="icon">&#11162;</span>
        </button>
    </p>
</form>
